---
# Playbook: radar_packages
# Version: 0.2.0
#
# Purpose: Pre-load system requirements for blah2 radar application and supporting tools
#
# This playbook installs the essential system components needed to run blah2 on Raspberry Pi 5:
#   1. Docker CE 27.x & Docker Compose v2 - Container runtime for blah2 services
#   2. System dependencies (graphviz, libusb, libudev, expect, wireless-tools)
#   3. Avahi mDNS daemon - .local hostname resolution
#   4. SDRplay API v3.15.2 - Hardware driver for RSPDuo SDR
#   5. Mender Docker Update Module and requirements
#   6. Chrony - NTP clock disciplining for accurate timing
#   7. Cloudflared - Secure tunneling for remote access
#   8. SDRconnect - Standalone SDR analysis tool
#   9. WiFi Connect captive portal (Balena) - Easy WiFi setup
#  10. RSPduo watchdog - Cron-based health check for automatic recovery
#
# Target: Raspberry Pi 5 fleet running Debian Bookworm (12.x)
#

- name: Load package versions
  include_vars: versions.yml

# 0. Update system package cache
- name: Update apt package cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

# 1. Docker installation
# 1a) Install prerequisites for Docker repo
- name: Install Docker prerequisites
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - software-properties-common
    state: present

# 1b) Add Docker's GPG key
- name: Add Docker's official GPG key
  shell: |
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/debian/gpg \
      | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    chmod a+r /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg

# 1c) Add Docker's apt repository 
- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=arm64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian {{ ansible_lsb.codename | default('bookworm') }} stable"
    state: present
    filename: docker

# 1d) Install Docker Engine and plugins
- name: Install Docker Engine
  apt:
    name:
      - "docker-ce={{ docker_ce_version }}"
      - "docker-ce-cli={{ docker_cli_version }}"
      - "containerd.io={{ containerd_version }}"
      - "docker-buildx-plugin={{ docker_buildx_version }}"
      - "docker-compose-plugin={{ docker_compose_version }}"
    state: present
    allow_downgrade: yes
    update_cache: yes

# 1e) Enable docker service on boot
- name: Enable Docker service for boot
  file:
    src: /lib/systemd/system/docker.service
    dest: /etc/systemd/system/multi-user.target.wants/docker.service
    state: link

# 1f) Add default user to docker group (run docker without sudo)
- name: Add default user to docker group
  user:
    name: "{{ default_user_name }}"
    groups: docker
    append: yes

# 2. Install system dependencies
- name: Install required system packages
  apt:
    name:
      - graphviz        # Required by blah2 processing
      - libusb-1.0-0    # Required by SDRplay service
      - libudev1        # Required for udev device detection
      - expect          # Required for SDRplay interactive installer
      - wireless-tools  # Required for iwgetid WiFi connection check
      - cron             # Required for RSPduo watchdog scheduled health checks
      - python3-flask   # Required for retina-gui web interface
      - python3-yaml    # Required for retina-gui config YAML parsing
      - python3-pydantic  # Required for retina-gui form validation
      - python3-requests  # Required for retina-gui Mender API calls
      - python3-pip     # Required to install Flask-WTF (not in Bookworm apt)
    state: present

- name: Install Flask-WTF via pip (not available as Debian package)
  pip:
    name: flask-wtf
    executable: pip3
    extra_args: --break-system-packages

# 2a. Enable cron daemon on boot
- name: Enable cron service on boot
  file:
    src: /lib/systemd/system/cron.service
    dest: /etc/systemd/system/multi-user.target.wants/cron.service
    state: link

# 2b. Install Avahi for mDNS .local hostname resolution
#
# The names themselves are set up by the mdns_identity role, which runs later:
# ret<node_id>.local per node, plus owl.local shared across all of them. This
# task only puts the daemon and its dependencies in place.
#
# retina.local used to be published here by an avahi-alias-retina.service. It
# has been retired — it could never work on a LAN with more than one node
# (avahi-publish -a cannot make a shared record, so every node collided with
# every other and flapped on a ten-second restart loop), and owl.local now
# covers what it was for.
- name: Install Avahi mDNS daemon
  apt:
    name:
      - avahi-daemon    # mDNS service for .local hostname advertisement
      - avahi-utils     # avahi-browse, used by retina-gui to discover peers
      - libnss-mdns     # Name service switch module for mDNS resolution
      - python3-dbus    # owl-mdns-alias publishes the shared alias over DBus
    state: present
    update_cache: yes

- name: Enable Avahi daemon on boot
  file:
    src: /lib/systemd/system/avahi-daemon.service
    dest: /etc/systemd/system/multi-user.target.wants/avahi-daemon.service
    state: link

# 3. Install SDRplay API
# 3a) Create directory 
- name: Create SDRplay lib directory
  file:
    path: "/opt/blah2/lib/sdrplay-{{ sdrplay_version }}"
    state: directory
    mode: '0755'

# 3b) Download installer
- name: Download SDRplay API installer
  get_url:
    url: "{{ sdrplay_url }}"
    dest: "/opt/blah2/lib/sdrplay-{{ sdrplay_version }}/SDRplay_RSP_API-Linux-{{ sdrplay_version }}.run"
    mode: '0755'

# 3c) Extract SDRplay API
- name: Extract SDRplay API 
  shell: "./SDRplay_RSP_API-Linux-{{ sdrplay_version }}.run --tar -xvf -C ."
  args:
    chdir: "/opt/blah2/lib/sdrplay-{{ sdrplay_version }}"
    creates: "/opt/blah2/lib/sdrplay-{{ sdrplay_version }}/install_lib.sh"

# 3d) Install SDRplay API with expect
- name: Install SDRplay API library (automated)
  shell: |
    expect << 'EOF'
    set timeout 120
    log_user 1
    
    spawn ./install_lib.sh
    
    # Press RETURN to view license
    expect "Press RETURN"
    send "\r"
    
    # Wait for 'more' pager, then quit
    sleep 1
    send "q"
    
    # Accept license
    expect "y/n"
    send "y\r"
    
    # Accept defaults
    expect "y/n"
    send "y\r"
    
    expect eof
    EOF
    
    ldconfig
  args:
    chdir: "/opt/blah2/lib/sdrplay-{{ sdrplay_version }}"
    creates: /usr/local/lib/libsdrplay_api.so
  register: sdrplay_output

# 3e) Verify udev rules installation
- name: Verify SDRplay udev rules exist
  stat:
    path: /etc/udev/rules.d/66-sdrplay.rules
  register: udev_rules

- name: Confirm udev rules installation
  debug:
    msg: "SDRplay udev rules installed: {{ udev_rules.stat.exists }}"

# 3f) Configure udev trigger on boot
- name: Ensure rc.local exists with proper structure
  copy:
    dest: /etc/rc.local
    content: |
      #!/bin/bash
      exit 0
    mode: '0755'
    force: no

- name: Trigger udev on boot for hardware detection
  lineinfile:
    path: /etc/rc.local
    insertbefore: "^exit 0"
    line: "udevadm control --reload-rules && udevadm trigger"

# 5. Install nano for text editing
- name: Install nano editor
  apt:
    name: nano
    state: present
    update_cache: yes

# 5a. Install Chrony for improved NTP clock disciplining
- name: Install Chrony NTP daemon
  apt:
    name: chrony
    state: present
    update_cache: yes

# 5b. Install Cloudflared for secure tunneling
#
# Installed from the versioned .deb on GitHub rather than Cloudflare's apt
# repo. That repo carries only whatever Cloudflare shipped most recently - it
# holds exactly one version and prunes the rest - so an exact pin against it
# cannot survive their next release. It bought no reproducibility either: the
# only installable version was always "current". This broke the os-v0.16.0
# build outright once 2026.8.2 was dropped in favour of 2026.8.3, roughly two
# weeks after it was pinned.
#
# GitHub keeps every release permanently, so pinning there is what the pin was
# always meant to be: the connector version is a property of the OS release,
# not of the day the image happened to be built.
- name: Download the pinned Cloudflared .deb
  get_url:
    url: "https://github.com/cloudflare/cloudflared/releases/download/{{ cloudflared_version }}/cloudflared-linux-arm64.deb"
    dest: "/tmp/cloudflared-{{ cloudflared_version }}-arm64.deb"
    mode: '0644'

- name: Install Cloudflared
  apt:
    deb: "/tmp/cloudflared-{{ cloudflared_version }}-arm64.deb"
    state: present

- name: Remove the downloaded Cloudflared .deb
  file:
    path: "/tmp/cloudflared-{{ cloudflared_version }}-arm64.deb"
    state: absent

# 5c. Install SDRconnect for standalone SDR analysis
- name: Install SDRconnect dependencies
  apt:
    name:
      - libmp3lame-dev
      - file              # Left in place from the old .run installer's requirements; unconfirmed whether SDRconnect itself still needs it now that install is a plain tar extract
      - libasound2        # Required by SDRconnect for audio output (64-bit time_t version)
    state: present
    update_cache: yes

- name: Create SDRconnect directory
  file:
    path: "/opt/sdrconnect-{{ sdrconnect_version }}"
    state: directory
    mode: '0755'

# SDRplay stopped shipping SDRconnect as a self-extracting .run installer -
# sdrconnect_url now points at a plain tarball-of-tarballs (rigcontrol +
# sdrconnect, each their own .tar.gz + .sha256), so there is no installer
# wizard to drive any more. rigcontrol is deliberately left un-extracted:
# it wasn't part of this OS before and installing it is a separate decision,
# not an implied side effect of this fix. The inner filename is hardcoded,
# same as the old installer's filename was - if SDRplay renames it again on
# the next update, this needs bumping the same way that did.
- name: Download and extract the SDRconnect archive bundle
  unarchive:
    src: "{{ sdrconnect_url }}"
    dest: "/opt/sdrconnect-{{ sdrconnect_version }}/"
    remote_src: yes
    creates: "/opt/sdrconnect-{{ sdrconnect_version }}/sdrconnect_linux-arm64_93b44446f.tar.gz"
    # SDRplay's tarball embeds its build machine's uid/gid (197609), which
    # doesn't exist in this build container - plain tar tries to chown to it
    # and fails outright. --no-same-owner extracts as whoever is running this
    # (root) instead of trying to preserve the archive's original owner.
    extra_opts:
      - --no-same-owner

- name: Create SDRconnect install directory
  file:
    path: /opt/sdrconnect
    state: directory
    mode: '0755'

- name: Extract SDRconnect itself from the bundle
  unarchive:
    src: "/opt/sdrconnect-{{ sdrconnect_version }}/sdrconnect_linux-arm64_93b44446f.tar.gz"
    dest: /opt/sdrconnect/
    remote_src: yes
    # Checks for the binary, not the directory - the directory now always
    # exists by the time this runs (previous task creates it unconditionally
    # so unarchive has a dest to extract into), so guarding on it here would
    # make this look already-done on every run and skip extracting entirely.
    creates: /opt/sdrconnect/SDRconnect
    extra_opts:
      - --no-same-owner

- name: Fix SDRconnect shared library permissions
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '0644'
  loop:
    - /opt/sdrconnect/libHarfBuzzSharp.so
    - /opt/sdrconnect/libSkiaSharp.so
    - /opt/sdrconnect/swig_bindings.so

- name: Clean up SDRconnect installer
  file:
    path: "/opt/sdrconnect-{{ sdrconnect_version }}"
    state: absent

# 6. Install WiFi Connect for captive portal setup
- name: Install dnsmasq for wifi-connect
  apt:
    name: dnsmasq
    state: present

- name: Stop dnsmasq service
  shell: systemctl stop dnsmasq || true

- name: Mask dnsmasq service (prevent it from starting)
  file:
    src: /dev/null
    dest: /etc/systemd/system/dnsmasq.service
    state: link
    force: yes

- name: Download and extract wifi-connect binary
  unarchive:
    src: "{{ balena_binary_url }}"
    dest: /tmp/
    remote_src: yes
  retries: 3
  delay: 10
  register: result
  until: result is succeeded

- name: Install wifi-connect binary
  copy:
    src: /tmp/wifi-connect
    dest: /usr/local/sbin/wifi-connect
    mode: '0755'
    remote_src: yes

- name: Create temp directory for UI extraction
  file:
    path: /tmp/wifi-ui-temp
    state: directory

- name: Download and extract wifi-connect UI
  unarchive:
    src: "{{ balena_ui_url }}"
    dest: /tmp/wifi-ui-temp/
    remote_src: yes
  retries: 3
  delay: 10
  register: result
  until: result is succeeded

- name: Create wifi-connect directory
  file:
    path: /usr/local/share/wifi-connect
    state: directory
    mode: '0755'

- name: Install wifi-connect UI files
  shell: cp -r /tmp/wifi-ui-temp /usr/local/share/wifi-connect/ui

# WiFi is still the preferred path through this portal, but users who get
# stuck (or simply have a cable handy) should know Ethernet is an option.
# The UI is a prebuilt static bundle from balena (balena_ui_url) — patch the
# banner into index.html rather than the JS bundle, since it's a plain HTML
# insertion that doesn't depend on the bundled app's internals.
- name: Add 'connect via Ethernet' hint banner to wifi-connect UI
  replace:
    path: /usr/local/share/wifi-connect/ui/index.html
    regexp: '<body>'
    replace: '<body><div style="background:#1a1a1a;color:#fff;text-align:center;padding:10px;font:14px sans-serif;">Prefer not to set up WiFi here? Plug in an Ethernet cable and visit <strong>http://owl.local</strong> instead.</div>'

- name: Clean up wifi-connect temp files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/wifi-connect
    - /tmp/wifi-ui-temp

# 7. Create wifi-connect systemd service
- name: Create wifi-connect systemd service
  copy:
    dest: /etc/systemd/system/wifi-connect.service
    mode: '0644'
    content: |
      [Unit]
      Description=WiFi Connect Captive Portal
      After=NetworkManager.service
      Wants=NetworkManager.service
      # Run the ethernet watcher alongside the portal so a cable plugged in
      # after the portal has already started is noticed without a reboot.
      Wants=ethernet-watch.timer
      # Note: No Before=retina-gui.service - let GUI start immediately
      # wifi-connect will stop it only if captive portal is actually needed

      [Service]
      Type=simple
      # Wait 30 seconds for NetworkManager to connect to saved WiFi networks
      ExecStartPre=/bin/sleep 30
      # Only start if WiFi is not connected (using balena's recommended approach)
      ExecStartPre=/bin/bash -c '! iwgetid -r'
      # Only start if no wired Ethernet device is already connected — plugging
      # in a cable is a valid alternative to the captive portal.
      ExecStartPre=/bin/bash -c '! nmcli -t -f TYPE,STATE device status | grep -q "^ethernet:connected"'
      # Stop retina-gui to free port 80 for captive portal
      ExecStartPre=-/bin/systemctl stop retina-gui.service
      ExecStart=/usr/local/sbin/wifi-connect --portal-ssid node-setup
      # Restart retina-gui after WiFi is configured
      ExecStopPost=-/bin/systemctl start retina-gui.service
      Restart=on-failure
      RestartSec=60

      [Install]
      WantedBy=multi-user.target

- name: Enable wifi-connect service for boot
  file:
    src: /etc/systemd/system/wifi-connect.service
    dest: /etc/systemd/system/multi-user.target.wants/wifi-connect.service
    state: link

# 7b. Ethernet watcher — stops an already-running captive portal as soon as a
# wired connection appears, so a user stuck on node-setup can escape it just
# by plugging in a cable, without waiting for the 60s Restart=on-failure cycle.
- name: Create ethernet-watch systemd service
  copy:
    dest: /etc/systemd/system/ethernet-watch.service
    mode: '0644'
    content: |
      [Unit]
      Description=Stop wifi-connect captive portal once Ethernet is connected
      PartOf=wifi-connect.service

      [Service]
      Type=oneshot
      ExecStart=/bin/bash -c 'nmcli -t -f TYPE,STATE device status | grep -q "^ethernet:connected" && systemctl stop wifi-connect.service || true'

- name: Create ethernet-watch systemd timer
  copy:
    dest: /etc/systemd/system/ethernet-watch.timer
    mode: '0644'
    content: |
      [Unit]
      Description=Periodically check for Ethernet while the captive portal is up
      PartOf=wifi-connect.service

      [Timer]
      OnActiveSec=5s
      OnUnitActiveSec=5s

      [Install]
      WantedBy=wifi-connect.service

# 8. Hold critical packages to prevent breaking auto-upgrades
- name: Hold packages that must not move under a running system
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - docker-ce
    - docker-ce-cli
    - docker-compose-plugin
    - docker-buildx-plugin
    - containerd.io
    # Held for the same reason: an unattended upgrade swapping the connector
    # underneath a running tunnel is not something to discover in the field.
    - cloudflared

# 9. RSPduo watchdog: cron-based health check that auto-restarts the stack on detection failure
- name: Create blah2 script directory
  file:
    path: /opt/blah2/script
    state: directory
    mode: '0755'

- name: Install RSPduo watchdog script
  copy:
    dest: /opt/blah2/script/blah2_rspduo_restart.bash
    mode: '0755'
    content: |
      #!/bin/bash

      # Run script with a crontab to automatically restart on error.
      # Checks the API to see if data is still being pushed through.

      COMPOSE_FILE=/data/mender-docker-compose/current/manifests/docker-compose.yaml
      PROJECT=retina-node
      MODE_FILE=/data/retina-gui/mode.txt
      GRACE_PERIOD_SECONDS=60
      RESTART_COUNT_STATE=/run/blah2-rspduo-watchdog.count

      # The same lock retina-gui takes for every operation that drives this compose
      # project (see its restart_lock.py). Taken with flock(1) below.
      RESTART_LOCK=/data/retina-gui/restart.lock

      # retina-gui's calibrate.lock (see its device_state.py). Auto-Calibrate owns
      # the SDR for the whole of a run - restarting the stack underneath it does not
      # just race, it silently corrupts the result: the run applies gain/LNA settings
      # via blah2's live retune API, which a `compose down`/`up` reverts to whatever
      # config.yml says, while the run carries on attributing its readings to
      # settings that are no longer in effect.
      CALIBRATE_LOCK=/data/retina-gui/calibrate.lock
      # Mirrors CALIBRATE_LOCK_TIMEOUT in retina-gui's device_state.py - if the GUI
      # considers a lock this old to be stale, so should this script, or a crashed
      # calibration would silence the watchdog indefinitely.
      CALIBRATE_LOCK_TIMEOUT_SECONDS=1200

      # Don't interfere when spectrum or sdrconnect mode is active - blah2 is intentionally stopped
      if [ -f "$MODE_FILE" ] && { [ "$(cat $MODE_FILE)" = "spectrum" ] || [ "$(cat $MODE_FILE)" = "sdrconnect" ]; }; then
        exit 0
      fi

      # Don't interrupt an auto-calibration run (see CALIBRATE_LOCK above).
      if [ -f "$CALIBRATE_LOCK" ]; then
        LOCK_MTIME=$(stat -c %Y "$CALIBRATE_LOCK" 2>/dev/null || echo 0)
        LOCK_AGE=$(( $(date +%s) - LOCK_MTIME ))
        if [ "$LOCK_AGE" -lt "$CALIBRATE_LOCK_TIMEOUT_SECONDS" ]; then
          exit 0
        fi
      fi

      # Detect blah2 crash-looping under Docker's own restart policy. RestartCount
      # only increments when the daemon relaunches the *same* container after it
      # exits, and resets to 0 whenever this script (or a GUI Apply) recreates it
      # via `compose down`/`up`. If blah2 is dying and restarting on its own faster
      # than this 5-minute cron cadence, StartedAt is always fresh - the grace
      # period below would skip every single run forever, silently masking the
      # crash loop instead of ever reaching the recovery step.
      RESTART_COUNT=$(docker inspect -f '{% raw %}{{.RestartCount}}{% endraw %}' blah2 2>/dev/null)
      PREV_RESTART_COUNT=$(cat "$RESTART_COUNT_STATE" 2>/dev/null)
      [ -n "$RESTART_COUNT" ] && echo "$RESTART_COUNT" > "$RESTART_COUNT_STATE"

      CRASH_LOOPING=false
      if [ -n "$RESTART_COUNT" ] && [ -n "$PREV_RESTART_COUNT" ] && [ "$RESTART_COUNT" -gt "$PREV_RESTART_COUNT" ]; then
        CRASH_LOOPING=true
        echo "blah2 is crash-looping (RestartCount $PREV_RESTART_COUNT -> $RESTART_COUNT since last check) - bypassing grace period"
      fi

      # Give blah2 a grace period after a (re)start before judging it stale - it
      # needs time to re-acquire the RSPduo and start producing fresh map data,
      # whether the restart just came from this script or a GUI config Apply.
      # Skipped while crash-looping (see above) so the recovery step below still runs.
      if [ "$CRASH_LOOPING" = false ]; then
        CONTAINER_STARTED=$(docker inspect -f '{% raw %}{{.State.StartedAt}}{% endraw %}' blah2 2>/dev/null)
        if [ -n "$CONTAINER_STARTED" ]; then
          STARTED_EPOCH=$(date -d "$CONTAINER_STARTED" +%s 2>/dev/null)
          NOW_EPOCH=$(date +%s)
          if [ -n "$STARTED_EPOCH" ] && [ $((NOW_EPOCH - STARTED_EPOCH)) -lt $GRACE_PERIOD_SECONDS ]; then
            exit 0
          fi
        fi
      fi

      # --max-time so an unresponsive API cannot stall this script indefinitely.
      # Without it a hung endpoint - the exact condition being checked for - leaves
      # one instance blocked while cron keeps starting more every 5 minutes.
      FIRST_CHAR=$(curl -s --max-time 10 127.0.0.1:3000/api/map | head -c1)
      TIMESTAMP=$(curl -s --max-time 10 127.0.0.1:3000/api/map | head -c23 | tail -c10)
      # No answer, or not a number, reads as stale. Left empty, the subtraction
      # below failed with "operand expected" whenever blah2-api was down.
      case "$TIMESTAMP" in ''|*[!0-9]*) TIMESTAMP=0 ;; esac
      CURR_TIMESTAMP=$(date +%s)
      DIFF_TIMESTAMP=$(($CURR_TIMESTAMP-$TIMESTAMP))

      if [[ "$FIRST_CHAR" != "{" ]] || [[ $DIFF_TIMESTAMP -gt 60 ]]; then
        # Take the same lock retina-gui holds for a config apply, and hold it for
        # the whole down/up. This replaces a `pgrep -f "docker compose -p $PROJECT"`
        # guard that could not work: retina-gui's apply spends ~30s in an SDRplay
        # settle window with no compose process running at all, so pgrep saw an idle
        # system and let this script fire `compose down` straight into the middle of
        # an apply - which is what leaves containers renamed to <hash>_<name> and the
        # daemon rejecting the real name as already in use. Confirmed live: during
        # that window the lock is held and no compose process exists.
        #
        # -n (don't wait): if a restart is already in flight it will very likely
        # resolve what this check just detected, and cron comes back in 5 minutes
        # regardless. Waiting would only stack up instances.
        mkdir -p "$(dirname "$RESTART_LOCK")" 2>/dev/null || true
        exec 9>"$RESTART_LOCK" || exit 0
        if ! flock -n 9; then
          echo "A stack restart is already in flight - skipping this check"
          exit 0
        fi

        docker compose -p $PROJECT -f $COMPOSE_FILE down
        kill -9 $(pgrep -f "sdrplay_apiService") 2>/dev/null || true
        systemctl restart sdrplay.service
        docker compose -p $PROJECT -f $COMPOSE_FILE up -d
        echo "Successfully restarted blah2"
      fi

- name: Install RSPduo watchdog cron job
  copy:
    dest: /etc/cron.d/blah2-rspduo-watchdog
    mode: '0644'
    content: |
      # RSPduo health check: restart retina-node stack if blah2 API data is stale (>60s)
      */5 * * * *  root  /opt/blah2/script/blah2_rspduo_restart.bash

