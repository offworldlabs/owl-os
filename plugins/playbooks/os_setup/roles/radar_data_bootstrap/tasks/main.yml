---
# Playbook: radar_data_bootstrap
# Version: 0.1.3
# 
# Purpose: Bootstrap /data/retina-node/ directory structure and services

- name: Load package versions
  include_vars: versions.yml


# 1. Configure Docker persistent storage on /data partition
# Per Mender docs: Docker images must be stored on persistent partition
# to survive A/B rootfs OTA updates. Default /var/lib/docker is wiped.
# See: https://docs.mender.io/artifact-creation/create-an-artifact

- name: Create Docker data directory on persistent partition
  file:
    path: /data/docker
    state: directory
    mode: '0711'
    owner: root
    group: root

- name: Configure Docker daemon for persistent storage with RAM-based logging
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "data-root": "/data/docker",
        "storage-driver": "overlay2",
        "features": {
          "containerd-snapshotter": false
        },
        "log-driver": "journald",
        "log-opts": {
          "tag": "{% raw %}{{.Name}}{% endraw %}"
        },
        "default-ulimits": {
          "core": {
            "Name": "core",
            "Soft": 0,
            "Hard": 0
          }
        }
      }
    mode: '0644'
    owner: root
    group: root
# Note: Docker 29+ uses containerd image store by default, which ignores data-root
# for image layers. Setting containerd-snapshotter: false uses classic overlay2
# storage so ALL data goes to data-root and persists across Mender A/B updates.
# See: https://docs.mender.io/artifact-creation/create-an-artifact

# Note: default-ulimits disables core dumps for every container. dockerd runs
# with LimitCORE=infinity and containers inherit it, kernel.core_pattern on this
# image is the bare relative name "core", and a container's working directory is
# in its writable layer, which is on /data. So a segfault writes an image of the
# process's address space to the SD card: blah2 alone is 411 MB resident, it is
# the service that crashes when the SDRplay API wedges, and it runs under
# restart: always, so a crash loop dumps that repeatedly with nothing removing
# what it wrote. Nothing here consumes core dumps -- crashes are diagnosed from
# journald -- so the useful setting is zero.

# 2. Create base directory structure
- name: Create /data/retina-node directory structure
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: root
    group: root
  loop:
    - /data/retina-node
    - /data/retina-node/config
    - /data/retina-node/blah2
    - /data/retina-node/blah2/save
    - /data/retina-node/blah2/test

# 3. Create default tar1090.env for first boot
- name: Create default tar1090.env for first boot
  copy:
    dest: /data/retina-node/config/tar1090.env
    mode: '0644'
    owner: root
    group: root
    force: no  # Don't overwrite if config-merger has already populated it
    content: |
      # Default tar1090 environment - will be overwritten by config-merger
      # These are placeholder values for Docker Compose parsing on first boot
      RECEIVER_LAT=0
      RECEIVER_LON=0
      RECEIVER_ALT=0
      ADSBLOL_ENABLED=false
      ADSBLOL_RADIUS=40

# 3a. Boot guard: set aside a compose .env that compose cannot parse, so a
# power cut during the config-merger's write cannot keep the stack down
# through every reboot. See the script's header.
- name: Install retina-env-guard
  copy:
    src: retina-env-guard
    dest: /usr/local/sbin/retina-env-guard
    mode: '0755'
    owner: root
    group: root

# 3. Create systemd service for retina-node auto-start after OS updates
- name: Create retina-node auto-start service
  copy:
    dest: /etc/systemd/system/retina-node.service
    mode: '0644'
    owner: root
    group: root
    content: |
      [Unit]
      Description=Start retina-node stack containers
      After=docker.service network-online.target
      Wants=network-online.target
      Requires=docker.service
      ConditionPathExists={{ retina_node_manifests_path }}/docker-compose.yaml

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory={{ retina_node_manifests_path }}
      Environment="RETINA_NODE_PATH={{ retina_node_manifests_path }}"
      # "-": the guard is best effort and must never stop the stack starting.
      ExecStartPre=-/usr/local/sbin/retina-env-guard
      ExecStart=/bin/bash -c '/usr/bin/docker compose -p retina-node run --rm config-merger && /usr/bin/docker compose -p retina-node up -d --remove-orphans'
      StartLimitBurst=3
      StartLimitIntervalSec=300

      [Install]
      WantedBy=multi-user.target

- name: Enable retina-node service
  file:
    src: /etc/systemd/system/retina-node.service
    dest: /etc/systemd/system/multi-user.target.wants/retina-node.service
    state: link

# ======================================================================
# retina-gui Web Interface
# ======================================================================

# 6. Clone retina-gui at pinned version
- name: Clone retina-gui repository
  git:
    repo: "{{ retina_gui_repo_url }}"
    dest: /tmp/retina-gui
    version: "{{ retina_gui_version }}"

# 7. Copy entire retina-gui to /opt (app code updates with OS)
- name: Copy retina-gui to /opt
  copy:
    src: /tmp/retina-gui/
    dest: /opt/retina-gui/
    remote_src: yes

# 8. Create /data/retina-gui for persistent SSH keys
- name: Create /data/retina-gui directory
  file:
    path: /data/retina-gui
    state: directory
    mode: '0755'

# 9. Install and enable systemd service
- name: Copy retina-gui systemd service
  copy:
    src: /tmp/retina-gui/systemd/retina-gui.service
    dest: /etc/systemd/system/retina-gui.service
    mode: '0644'
    remote_src: yes

- name: Enable retina-gui service for boot
  file:
    src: /etc/systemd/system/retina-gui.service
    dest: /etc/systemd/system/multi-user.target.wants/retina-gui.service
    state: link

# Install sdrconnect systemd unit (started/stopped on demand by retina-gui's
# mode switcher — never enabled for boot, since it would conflict with blah2).
- name: Copy sdrconnect systemd service
  copy:
    src: /tmp/retina-gui/systemd/sdrconnect.service
    dest: /etc/systemd/system/sdrconnect.service
    mode: '0644'
    remote_src: yes

# 10. Configure SSH to read authorized_keys from /data/
#
# One key store, and deliberately only one. The home-directory default that
# used to be listed alongside it (.ssh/authorized_keys) sat inside the chroot
# Mender file transfer writes into, as the `node` user, so anyone able to
# transfer a file could write themselves an authorized key and obtain SSH
# regardless of what the owner's remote shell agreement said.
#
# File transfer cannot simply be turned off instead: it is how node-infra
# delivers the Cloudflare tunnel token, so gating it would make the two owner
# agreements depend on each other. Removing the second key store is what lets
# both be true at once.
#
# /data/retina-gui/authorized_keys is root-owned and outside every chroot
# Mender writes to. Verified across the fleet before this changed: no node had
# a /home/*/.ssh at all, ssh_pub_keys/ bakes nothing into images, and
# PasswordAuthentication is off, so nothing was relying on the removed path.
- name: Configure sshd AuthorizedKeysFile for persistent keys
  lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: '^#*\s*AuthorizedKeysFile'
    line: 'AuthorizedKeysFile /data/retina-gui/authorized_keys'
    state: present

# 11. Cleanup retina-gui
- name: Remove temporary retina-gui clone
  file:
    path: /tmp/retina-gui
    state: absent

# ======================================================================
# Mender Bootstrap Artifact
# ======================================================================
# Creates bootstrap.mender so Mender dashboard shows OS version on first boot
# Provides key must match OTA artifact format: rootfs-image.<os_name>.version

- name: Install mender-artifact for bootstrap creation
  apt:
    name: mender-artifact
    state: present

- name: Create bootstrap artifact for initial OS version
  shell: |
    mender-artifact write bootstrap-artifact \
      --device-type "{{ mender_device_type }}-{{ edi_bootstrap_architecture }}" \
      --artifact-name "{{ os_name }}-v{{ os_version }}" \
      --provides "rootfs-image.{{ os_name }}.version:v{{ os_version }}" \
      --output-path /var/lib/mender/bootstrap.mender
  args:
    creates: /var/lib/mender/bootstrap.mender
