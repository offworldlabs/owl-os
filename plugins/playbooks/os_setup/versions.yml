---
# OWL-OS Package Versions
# Updated: 2026-4-23
# Target: Raspberry Pi 5, Debian Bookworm (12.x)

# Held packages (prevent apt auto-upgrade):
# - docker-ce, docker-ce-cli, docker-compose-plugin, containerd.io
# - cloudflared
# - mender-client4, mender-auth, mender-update, mender-connect, mender-configure, mender-docker-compose

# Critical Packages - Exact pins (hold enabled, test before upgrading)
# ======================================================================

# Raspberry Pi 5 Kernel - RPi Foundation optimized (required for DSP performance)
# Update after testing: apt-cache policy linux-image-rpi-2712
rpi_kernel_package: "linux-image-6.12.62+rpt-rpi-2712"

# Mender Client 6.0.0 suite
mender_client_version: "5.1.0-1+debian+bookworm"
mender_connect_version: "3.0.0-2+debian+bookworm"
mender_configure_version: "1.1.4-1+debian+bookworm"
mender_docker_compose_version: "1.0.0-1+debian+bookworm"
retina_node_manifests_path: "/data/mender-docker-compose/current/manifests"

# Docker
docker_ce_version: "5:29.1.2-1~debian.12~bookworm"
docker_cli_version: "5:29.1.2-1~debian.12~bookworm"
containerd_version: "2.2.0-2~debian.12~bookworm"
docker_buildx_version: "0.30.1-1~debian.12~bookworm"

# Docker Compose - exact pin
docker_compose_version: "5.1.3-1~debian.12~bookworm"

# Components and Versions
# ======================================================================

# SDRplay API for RSPDuo hardware
sdrplay_version: "3.15.2"
sdrplay_url: "https://pub-5a7a9064d7ff40ad86ad765aa0e227b8.r2.dev/sdrplay-api/SDRplay_RSP_API-Linux-3.15.2.run"

# SDRconnect for standalone SDR radio analysis
sdrconnect_version: "1.0.5"
sdrconnect_url: "https://pub-5a7a9064d7ff40ad86ad765aa0e227b8.r2.dev/sdrplay-api/sdrconnect-linux-arm64-files.tar"

# Cloudflared, for the remote access tunnel.
#
# Pinned and held like Docker rather than tracking whatever Cloudflare shipped
# on the day an image was built, so the connector version is a property of the
# OS release instead of the build date. 2026.8.2 is what the fleet is running
# and what the tunnel work was tested against.
cloudflared_version: "2026.8.2"

# Balena WiFi Connect for captive portal
balena_wifi_version: "v4.11.84"
balena_binary_url: "https://github.com/balena-os/wifi-connect/releases/download/v4.11.84/wifi-connect-aarch64-unknown-linux-gnu.tar.gz"
balena_ui_url: "https://github.com/balena-os/wifi-connect/releases/download/v4.11.84/wifi-connect-ui.tar.gz"

# retina-gui web interface
retina_gui_repo_url: "https://github.com/offworldlabs/retina-gui.git"
# v0.7.0 is the floor for telemetry: it is the first version that persists the
# three consent records retina-telemetry needs to register. On v0.6.0 a node
# comes up, finds no records, refuses to register, and says so only in a status
# document — which v0.7.0 is also the first version able to read.
retina_gui_version: "v0.10.0"  # mender-docker-compose path

