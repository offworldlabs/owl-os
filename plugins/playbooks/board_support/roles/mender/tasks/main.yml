---
- name: Load package versions
  include_vars: versions.yml
  
- name: Create mender directories on data partition.
  file:
    path: /data/{{ item }}
    state: directory
  loop:
    - mender
    - mender-monitor

- name: Create symbolic links to the data partition.
  file:
    src: /data/{{ item }}
    dest: /var/lib/{{ item }}
    state: link
  loop:
    - mender
    - mender-monitor

- name: Create directory for mender-configure configuration.
  file:
    dest: /var/lib/mender-configure
    state: directory
    mode: 0755

- name: Add an empty mender-configure configuration.
  copy:
    src: empty.json
    dest: /var/lib/mender-configure/device-config.json
    mode: 0600

- name: Mask some files that shall not be provided by the mender-client Debian package.
  copy:
    src: 05_mender_client
    dest: /etc/dpkg/dpkg.cfg.d/

- name: Ensure /usr/share/keyrings directory exists.
  file:
    path: /usr/share/keyrings
    state: directory
    mode: 0755

- name: Add Mender repository key.
  copy:
    src: mender-io-archive-keyring.gpg
    dest: /usr/share/keyrings/
    mode: 0644

- name: Add mender repository to sources.list.d.
  template:
    src: mender-io.list
    dest: /etc/apt/sources.list.d/

- name: Configure APT to prefer Mender repo over Debian.
  copy:
    src: mender-pin.pref
    dest: /etc/apt/preferences.d/mender
    mode: 0644

- name: Update apt cache.
  apt:
    update_cache: yes

- name: Install mender-client4 and jq.
  apt:
    name:
    - "mender-client4={{ mender_client_version }}"
    - jq
    state: present
    allow_downgrade: yes 
    install_recommends: no

- name: Install mender addons.
  apt:
    name:
    - "mender-connect={{ mender_connect_version }}"
    - "mender-configure={{ mender_configure_version }}"
    - "mender-docker-compose={{ mender_docker_compose_version }}"
    state: present
    install_recommends: no

- name: Load project specific (customized) mender configuration.
  include_vars: "{{ item }}"
  with_first_found:
    - "{{ mender_config_directory }}/mender_custom.yml"
    - "{{ mender_config_directory }}/mender.yml"

- name: Write mender main configuration.
  template:
    src: mender.conf
    dest: /etc/mender/

- name: Write mender fallback configuration for rootfs-image module
  template:
    src: mender.conf
    dest: /var/lib/mender/mender.conf

- name: Write mender-connect configuration.
  template:
    src: mender-connect.conf
    dest: /etc/mender/

- name: Configure the device type.
  template:
    src: device_type
    dest: /data/mender/device_type

- name: Copy inventory scripts.
  copy:
    src: "{{ item }}"
    dest: /usr/share/mender/inventory/
    mode: 0755
  with_fileglob:
    - "{{ mender_config_directory }}/inventory/*"

- name: Copy identity scripts.
  template:
    src: "{{ item }}"
    dest: /usr/share/mender/identity/
    mode: 0755
  with_fileglob:
    - "{{ mender_config_directory }}/identity/*"

- name: Create various integration directories.
  file:
    path: "{{ item }}"
    state: directory
  with_items:
    - /usr/share/mender/integration
    - /etc/systemd/system/mender-updated.service.d
  when: ebs_bootloader_type == "raspberry-pi"

- name: Make sure that the mender-client service picks the modified reboot script.
  copy:
    src: override.conf
    dest: /etc/systemd/system/mender-updated.service.d/
  when: ebs_bootloader_type == "raspberry-pi"

- name: Copy the bootloader integration script.
  copy:
    src: pi-uboot
    dest: /usr/share/mender/integration/
    mode: 0755
  when: ebs_bootloader_type == "raspberry-pi"

- name: Create a symbolic link for the reboot command.
  file:
    src: /usr/share/mender/integration/pi-uboot
    dest: /usr/share/mender/integration/reboot
    state: link
  when: ebs_bootloader_type == "raspberry-pi"

- name: Create symbolic links for fw_printenv and fw_setenv.
  file:
    src: /usr/share/mender/integration/pi-uboot
    dest: /usr/bin/{{ item }}
    state: link
  with_items:
    - fw_printenv
    - fw_setenv
  when: ebs_bootloader_type == "raspberry-pi"

- name: Hold Mender packages
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - mender-client4
    - mender-auth
    - mender-update
    - mender-connect
    - mender-configure
    - mender-docker-compose

# --- docker-compose Update Module: owl-os fork ---
# The packaged module stops the running stack before it loads the new images,
# rolls back into the live stack when an install fails early, and fails a
# committed deployment over an image that is already gone. The fork fixes all
# three; see the FORK: comments in files/update-modules/docker-compose.
# dpkg-divert moves the packaged file aside rather than overwriting it, so apt
# stays consistent and the upstream module is kept for comparison or undo.
# It is diverted outside modules/v3, where Mender would list it as a module.

- name: Divert the packaged docker-compose Update Module.
  command: >-
    dpkg-divert --local --rename
    --divert /usr/share/mender/docker-compose.upstream
    --add /usr/share/mender/modules/v3/docker-compose
  args:
    creates: /usr/share/mender/docker-compose.upstream

- name: Install the owl-os fork of the docker-compose Update Module.
  copy:
    src: update-modules/docker-compose
    dest: /usr/share/mender/modules/v3/docker-compose
    mode: '0755'

# --- Rootfs state scripts (update status tracking for retina-gui) ---

- name: Create Mender rootfs scripts directory.
  file:
    path: /etc/mender/scripts
    state: directory
    mode: '0755'

- name: Install retina rootfs state script (Download only; Artifact scripts are embedded in .mender).
  copy:
    src: "state-scripts/{{ item }}"
    dest: "/etc/mender/scripts/{{ item }}"
    mode: '0755'
  loop:
    - Download_Enter_00_retina_state

# --- Cloud services disabled by default (user enables via retina-gui) ---

- name: Create retina-gui data directory.
  file:
    path: /data/retina-gui
    state: directory

- name: Create cloud services disabled flag.
  copy:
    content: ''
    dest: /data/retina-gui/cloud-services-disabled

- name: Create mender cloud disabled backup directory.
  file:
    path: /data/mender-cloud-disabled
    state: directory

- name: Move mender.conf to backup location (cloud services disabled by default).
  command: mv /data/mender/mender.conf /data/mender-cloud-disabled/mender.conf

- name: Disable Mender services (cloud services off by default).
  file:
    path: /etc/systemd/system/multi-user.target.wants/{{ item }}
    state: absent
  loop:
    - mender-authd.service
    - mender-updated.service
    - mender-connect.service
