name: Tests

# The forked docker-compose Update Module, retina-env-guard and the stack-health
# inventory script run as root on every node. These tests run the real scripts
# under /bin/sh (dash on Ubuntu, as on the nodes) against a stub docker.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  update-modules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'pytest>=8.0'
      - name: Scripts are executable
        run: |
          test -x plugins/playbooks/board_support/roles/mender/files/update-modules/docker-compose
          test -x plugins/playbooks/os_setup/roles/radar_data_bootstrap/files/retina-env-guard
          test -x configuration/mender/inventory/mender-inventory-retina-stack
      - name: Tests
        run: pytest tests/
